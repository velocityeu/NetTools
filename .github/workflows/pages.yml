name: Publish learning centre

on:
  push:
    branches: [main]
    paths:
      - "website-preview/dist/**"
      - "docs/help/**"
      - "scripts/build_help.py"
      - "scripts/build_seo.py"
      - "scripts/prepare_site.py"
      - "scripts/verify_deployed_site.py"
      - "tests/pages_deployment_tests.py"
      - "tests/distribution_tests.py"
      - "scripts/build_portable_zip.py"
      - "scripts/build_pwa.py"
      - "scripts/package_pwa.py"
      - "src/core/**"
      - "src/web/**"
      - "include/**"
      - "tests/pwa/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Release events only dispatch a main-branch run: direct release deployments
  # can report success while serving an old artifact (actions/deploy-pages#383).
  # GITHUB_TOKEN may trigger workflow_dispatch; it cannot trigger release runs.
  release:
    types: [published]

permissions:
  contents: read

# Serialize the complete build/deploy transaction. Pending runs may coalesce;
# every surviving run checks out current main and refreshes current release data.
# Never cancel an active Pages deployment halfway through publication.
concurrency:
  group: nettools-pages
  cancel-in-progress: false

jobs:
  release_refresh:
    if: github.repository == 'velocityeu/NetTools' && github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Refresh Pages from the main branch after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

  build:
    if: github.repository == 'velocityeu/NetTools' && github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source: ${{ steps.site.outputs.source }}
      release_sha256: ${{ steps.site.outputs.release_sha256 }}
      pwa_sha256: ${{ steps.site.outputs.pwa_sha256 }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out current website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check shared help generation
        run: python3 scripts/build_help.py --check
      - name: Install pinned WebAssembly toolchain
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach 5eb0bde7585670252e8ba05e9d361627bffd08b5
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.15
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.15
          python3 -m pip install Pillow==12.3.0
      - name: Build and test offline web app
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 scripts/build_pwa.py
          python3 tests/pwa/offline_packaging_tests.py
          python3 scripts/package_pwa.py
          node --test tests/pwa/*.test.mjs
      - name: Verify Chromium and WebKit workflows
        run: |
          npm install --prefix out/pwa-test --save-exact playwright@1.63.0
          node out/pwa-test/node_modules/playwright/cli.js install --with-deps chromium webkit
          node tests/pwa/run-browser.cjs
      - name: Check crawlable lesson pages and sitemap
        run: python3 scripts/build_seo.py --check
      - name: Test deployed-site verification
        run: |
          python3 tests/pages_deployment_tests.py
          python3 tests/distribution_tests.py
      - name: Prepare site and verify release downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_site.py --output _site
      - name: Record expected deployed release metadata
        id: site
        run: |
          echo "pwa_sha256=$(sha256sum _site/app/sw.js | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_sha256=$(sha256sum _site/release-data.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Upload complete static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the verified site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify the public site serves this release metadata
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.release_sha256 }}
        run: python3 scripts/verify_deployed_site.py --url "$SITE_URL" --sha256 "$EXPECTED_SHA256" --timeout 600 --interval 15

      - name: Verify the public PWA serves this app version
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.pwa_sha256 }}
        run: python3 scripts/verify_deployed_site.py --url "$SITE_URL" --sha256 "$EXPECTED_SHA256" --asset app/sw.js --timeout 600 --interval 15
